<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Portal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a0a1f 0%, #050511 55%, #000000 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .portal-page {
            max-width: 720px;
            padding: 2rem;
        }
        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="portal-page">
        <h1>You have entered the Moon Portal</h1>
        <p>The screen zoomed in and transported you to a new magical page.</p>
    </div>
</body>
</html>
