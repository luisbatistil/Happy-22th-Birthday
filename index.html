<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 22nd Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <h1>Loading...</h1>
            <p id="loading-quote" class="loading-quote">Preparing your birthday surprise. Please wait 15 seconds.</p>
        </div>
    </div>

    <main class="page-content">
        <section class="hero">
            <h1>Happy 22nd Birthday!</h1>
            <p>Welcome to a special celebration page made just for you.</p>
        </section>

        <section class="message">
            <h2>Have a wonderful day!</h2>
            <p>Enjoy the cake, music, and all the love sent your way.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
