<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 22nd Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <h1>Loading...</h1>
            <p id="loading-quote" class="loading-quote">Preparing your birthday surprise. Please wait 15 seconds.</p>
        </div>
    </div>

    <div class="bg-zoom hidden"></div>

    <div class="portal-screen hidden">
        <section class="portal-hero">
            <h1>Moon Portal Awaits</h1>
            <p>click the button to open the moon portal.</p>
            <button id="portal-button" class="portal-button">🌘</button>
        </section>

        <div id="moon-portal" class="moon-portal hidden" aria-hidden="true">
            <div class="moon-core"></div>
            <div class="moon-glow"></div>
            <div class="particles"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
